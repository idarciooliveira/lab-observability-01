apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-web
spec:
  replicas: 2

  selector:
    matchLabels:
      app: insurance-web

  template:
    metadata:
      labels:
        app: insurance-web

    spec:
      containers:
        - name: insurance-web
          image: insurance-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5173
          env:
            - name: VITE_INSURANCE_API_URL
              value: "http://api-service:3000"
            - name: CORS_ALLOWED_ORIGINS
              value: "http://localhost:5173,http://localhost:8080"
