apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-web
spec:
  replicas: 2

  selector:
    matchLabels:
      app: insurance-web

  template:
    metadata:
      labels:
        app: insurance-web

    spec:
      containers:
        - name: insurance-web
          image: insurance-web:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
