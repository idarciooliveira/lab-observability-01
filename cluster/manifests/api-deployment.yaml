apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: insurance-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              value: "postgres://insurance_user:1234@host.docker.internal:5432/insurance_db"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4318"
            - name: OTEL_TOKEN
              value: ""
