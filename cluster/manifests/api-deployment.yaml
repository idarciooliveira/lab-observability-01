apiVersion: apps/v1
kind: Deployment
metadata:
  name: insurance-api
spec:
  replicas: 2

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      hostAliases:
        - ip: "172.17.0.1"
          hostnames: ["host.docker.internal"]
      containers:
        - name: api
          image: insurance-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: "postgresql://insurance_user:1234@host.docker.internal:5433/insurance_db"
            - name: OTEL_SERVICE_NAME
              value: "insurance-api"
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: "service.namespace=insurance,deployment.environment=dev"
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://host.docker.internal:4318"
            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: "http/protobuf"
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "Authorization=Bearer 74d895e638d8232a394e8e0a7600eddb300b78a807e329feed0708453ab410bd"
            - name: OTEL_TRACES_EXPORTER
              value: "otlp"
            - name: OTEL_METRICS_EXPORTER
              value: "otlp"
            - name: OTEL_LOGS_EXPORTER
              value: "otlp"
            - name: OTEL_METRIC_EXPORT_INTERVAL
              value: "15000"