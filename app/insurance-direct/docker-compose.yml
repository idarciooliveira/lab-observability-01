name: insurance-direct
services:
  insurance-api:
    build:
      context: ./insurance-api
      dockerfile: Dockerfile
    container_name: insurance-api
    ports:
      - "${INSURANCE_API_PORT:-8083}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - insurance-direct
    extra_hosts:
      # No-op on Docker Desktop (Win/Mac); required on native Linux Engine
      # so host.docker.internal resolves to the host gateway.
      - "host.docker.internal:host-gateway"
    environment:
      # Single database variable, parsed by the API (DatabaseConfig).
      # Format: postgresql://user:password@host:port/db
      # Credentials must match the postgres service init vars below.
      DATABASE_URL: ${DATABASE_URL:-postgresql://insurance_user:1234@postgres:5432/insurance_db}
      # Direct OTLP: app -> observability gateway, no local collector.
      # Gateway serves OTLP/HTTP only -> must be http/protobuf, never grpc.
      OTEL_SERVICE_NAME: insurance-api
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=insurance,deployment.environment=${ENV:-dev}
      OTEL_TRACES_EXPORTER: otlp
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      OTEL_METRIC_EXPORT_INTERVAL: 15000
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://host.docker.internal:4318}
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      # Single instance credential. The platform derives tenant/project
      # from this credential. Do NOT set tenant.id / project.id /
      # X-Scope-OrgID here.
      OTEL_EXPORTER_OTLP_HEADERS: Authorization=Bearer ${OTEL_TOKEN:?OTEL_TOKEN must be set}
      OTEL_INSTRUMENTATION_MICROMETER_ENABLED: "true"
      CHAOS_LATENCY_MS: ${CHAOS_LATENCY_MS:-0}
      CHAOS_REJECT_RATE: ${CHAOS_REJECT_RATE:-0}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:8080}

  insurance-web:
    build:
      context: ./insurance-web
      dockerfile: Dockerfile
      args:
        VITE_INSURANCE_API_URL: ${VITE_INSURANCE_API_URL:-http://localhost:8083}
    container_name: insurance-web
    ports:
      - "${WEB_PORT:-5173}:80"
    depends_on:
      - insurance-api
    networks:
      - insurance-direct

  postgres:
    image: postgres:16-alpine
    container_name: insurance-postgres
    environment:
      # Init credentials required by the postgres image.
      # Must stay in sync with the user/password/db in DATABASE_URL above.
      POSTGRES_DB: ${POSTGRES_DB:-insurance_db}
      POSTGRES_USER: ${POSTGRES_USER:-insurance_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-1234}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - insurance-postgres-data:/var/lib/postgresql/data
    networks:
      - insurance-direct
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-insurance_user} -d ${POSTGRES_DB:-insurance_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  insurance-postgres-data:

networks:
  insurance-direct:
    name: insurance-direct
