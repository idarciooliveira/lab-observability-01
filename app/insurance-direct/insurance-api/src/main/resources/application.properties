spring.application.name=insurance-services

# Database connectivity comes from a single DATABASE_URL variable, e.g.
# postgresql://insurance_user:secret@postgres:5432/insurance_db
# (parsed by infra.config.DatabaseConfig into a JDBC DataSource).
# Default targets a local postgres (host-mapped compose port) for `mvn spring-boot:run`.
# Percent-encode special chars in the password (@ as %40, etc.).
# No spring.datasource.* keys here on purpose: the DatabaseConfig bean is the source of truth.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Actuator uses its own handler mapping: WebMvcConfigurer CORS rules do NOT
# apply here, so browser GETs to /actuator/* were blocked ("Failed to fetch").
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost:8080}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
