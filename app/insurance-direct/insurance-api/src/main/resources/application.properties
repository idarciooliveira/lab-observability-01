spring.application.name=insurance-services

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/insurance_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:insurance_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:insurance_pass}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
# Actuator uses its own handler mapping: WebMvcConfigurer CORS rules do NOT
# apply here, so browser GETs to /actuator/* were blocked ("Failed to fetch").
management.endpoints.web.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:80,http://localhost:8080}
management.endpoints.web.cors.allowed-methods=GET,OPTIONS
management.endpoints.web.cors.allowed-headers=*
