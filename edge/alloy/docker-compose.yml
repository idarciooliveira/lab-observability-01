name: lab-edge

services:
  alloy:
    image: grafana/alloy:v1.9.1
    container_name: lab-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
    ports:
      - "${ALLOY_OTLP_GRPC_PORT:-4317}:4317"   # OTLP/gRPC  (docs/architecture.md §2)
      - "${ALLOY_OTLP_HTTP_PORT:-4318}:4318"   # OTLP/HTTP  (docs/architecture.md §2)
      - "${ALLOY_UI_PORT:-12345}:12345"        # Alloy UI + /-/healthy + /metrics
    volumes:
      - ./config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy
      - /var/run/docker.sock:/var/run/docker.sock:ro
    extra_hosts:
      # Lets Alloy scrape the docker-compose API (insurance-api:8080 fails
      # from here when the API runs in k3d) and lets k3d pods reach Alloy
      # back via host.docker.internal:4318.
      - "host.docker.internal:host-gateway"
    environment:
      TENANT_ID: ${TENANT_ID:-tenant-a}
      ENV: ${ENV:-dev}
      OTEL_TOKEN: ${OTEL_TOKEN:?OTEL_TOKEN must be set in edge/alloy/.env}
      # Core gateway (Traefik -> NGINX/OpenResty). No core yet in this lab
      # phase, so the exporter retries + queues until the core lands.
      CORE_GATEWAY_ENDPOINT: ${CORE_GATEWAY_ENDPOINT:-https://host.docker.internal/otlp}
      CORE_PROM_ENDPOINT: ${CORE_PROM_ENDPOINT:-https://host.docker.internal/prometheus/api/v1/write}
      CORE_LOKI_ENDPOINT: ${CORE_LOKI_ENDPOINT:-https://host.docker.internal/loki/api/v1/push}
      GATEWAY_TLS_INSECURE_SKIP_VERIFY: ${GATEWAY_TLS_INSECURE_SKIP_VERIFY:-true}
    restart: unless-stopped
    networks:
      - edge

  blackbox:
    image: prom/blackbox-exporter:v0.25.0
    container_name: lab-blackbox
    command:
      - --config.file=/etc/blackbox/blackbox.yml
    ports:
      - "${BLACKBOX_PORT:-9115}:9115"
    volumes:
      - ./blackbox.yml:/etc/blackbox/blackbox.yml:ro
    restart: unless-stopped
    networks:
      - edge

volumes:
  alloy-data:

networks:
  edge:
    name: lab-edge
